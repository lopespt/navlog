<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Navlog" />
  <meta name="theme-color" content="#09090b" />
  <title>Navlog</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #09090b; overscroll-behavior: none; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>.leaflet-container{background:#1c1c1e}.leaflet-tile-pane{filter:brightness(0.85)}</style>

  <!-- esm.sh + importmap: resolves bare "react", "react-dom/client",
       "react/jsx-runtime", "lucide-react" to esm.sh CDN URLs at the
       pinned version. -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1,react-dom@18.3.1"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <div id="bootstrap-status"></div>

  <!-- Boot + runtime diagnostic. Banner is hidden during healthy operation
       and pops red at the top of the page on any error (window.onerror or
       unhandledrejection), regardless of whether React has already mounted.
       Useful for catching regressions on mobile without DevTools — current
       refactor is moving JSX components into ES modules and we need
       visibility into late failures (e.g. clicking a tab triggers a render
       error in an extracted component). -->
  <script>
    (function() {
      var el = document.getElementById('bootstrap-status');
      var base = 'position:fixed;top:0;left:0;right:0;padding:1rem;font-family:monospace;font-size:0.8rem;z-index:9999;white-space:pre-wrap;word-break:break-word;line-height:1.4;background:#dc2626;color:#fff;';
      function show(text) { el.textContent = text; el.style.cssText = base; }
      window.addEventListener('error', function(e) {
        show('❌ Error\n' + (e.message || '(sem mensagem)') + '\nfile: ' + (e.filename || '?') + ':' + (e.lineno || '?'));
      });
      window.addEventListener('unhandledrejection', function(e) {
        var r = e.reason;
        var msg = r && (r.message || r.stack || r.toString()) || String(r);
        show('❌ Promise rejected\n' + msg);
      });
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0 && !el.textContent) {
          show('⏱ Timeout: nada renderizou em 20s. esm.sh pode estar lento ou bloqueado.');
        }
      }, 20000);
    })();
  </script>

  <!-- Globals the main module still consumes as window.X (no ESM port yet):
       Leaflet, PDF.js. Must load before the main module starts. -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- NOAA World Magnetic Model — loads asynchronously, fires 'geomagready'
       when ready so the main module's WMM cache invalidates correctly. -->
  <script type="module">
    try {
      const { default: geomagnetism } = await import('https://esm.sh/geomagnetism');
      window._geomagnetism = geomagnetism;
      window.dispatchEvent(new CustomEvent('geomagready'));
    } catch(e) {
      console.warn('geomagnetism failed to load:', e);
    }
  </script>

  <!-- Pure helpers loaded synchronously as UMD-style globals. Each module
       sets its exports on window so the main entry can use them as bare
       identifiers (Node tests load them via require()). -->
  <script src="lib/planning.js"></script>
  <script src="lib/coords.js"></script>
  <script src="lib/airac.js"></script>
  <script src="lib/storage.js"></script>
  <script src="lib/pdf.js"></script>
  <script src="lib/feedback.js"></script>
  <script src="lib/themes.js"></script>
  <script src="lib/fleet.js"></script>

  <!-- Main React entry. esm.sh/gh fetches app/main.jsx from raw.gh@main,
       compiles JSX server-side, returns ES module. Browser handles dep
       order — no babel-standalone race condition.

       The trailing &v=YYYYMMDD.HHMM cache-buster MUST be bumped on every
       commit that touches app/main.jsx or any app/components/*.jsx — it's
       just a query param so esm.sh treats each version as a distinct cache
       key and re-fetches from raw.githubusercontent.com immediately. Same
       value as the APP_VERSION constant inside main.jsx; keeping them in
       sync makes the rendered footer the source of truth for what's
       actually live. Without this, esm.sh's edge cache holds the previous
       compile of @main for an unbounded TTL, so users see stale code even
       after a deploy.

       Both react AND react-dom MUST be in ?deps= — pinning only react
       lets esm.sh resolve react-dom to its latest (19.x), which crashes
       with React error #525 "incompatible React versions" against the
       18.3.1 React the importmap binds in. -->
  <script type="module">
    import "https://esm.sh/gh/lopespt/navlog@main/app/main.jsx?deps=react@18.3.1,react-dom@18.3.1&v=20260517.1911";
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e));
      });
    }
  </script>
</body>
</html>
