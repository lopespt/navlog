<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Navlog" />
  <meta name="theme-color" content="#09090b" />
  <title>Navlog</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #09090b; overscroll-behavior: none; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>.leaflet-container{background:#1c1c1e}.leaflet-tile-pane{filter:brightness(0.85)}</style>

  <!-- esm.sh + importmap: resolves bare "react", "react-dom/client",
       "react/jsx-runtime", and "lucide-react" to esm.sh CDN URLs at the
       pinned version. The JSX runtime is what lets esm.sh/gh compile our
       .jsx files into real ES modules; lucide-react is consumed via named
       imports in app/main.jsx. -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- Globals the main module still consumes as window.X (no ESM port yet):
       Leaflet, PDF.js. Must load before the main module starts. -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- NOAA World Magnetic Model — loads asynchronously, fires 'geomagready'
       when ready so the main module's WMM cache invalidates correctly. -->
  <script type="module">
    try {
      const { default: geomagnetism } = await import('https://esm.sh/geomagnetism');
      window._geomagnetism = geomagnetism;
      window.dispatchEvent(new CustomEvent('geomagready'));
    } catch(e) {
      console.warn('geomagnetism failed to load:', e);
    }
  </script>

  <!-- Pure helpers loaded synchronously as UMD-style globals. Each module
       sets its exports on window so the main entry can use them as bare
       identifiers (Node tests load them via require()). -->
  <script src="lib/planning.js"></script>
  <script src="lib/coords.js"></script>
  <script src="lib/airac.js"></script>
  <script src="lib/storage.js"></script>
  <script src="lib/pdf.js"></script>

  <!-- Main React entry. esm.sh/gh fetches app/main.jsx from
       raw.githubusercontent.com at the pinned branch, compiles JSX
       server-side, and serves it as a real ES module. The browser's
       module loader handles dependency order — no babel-standalone
       race condition. Pinning @main + ?deps=react@18.3.1 keeps cache
       behaviour predictable; for production you can pin to a specific
       commit SHA instead. -->
  <script type="module">
    import "https://esm.sh/gh/lopespt/navlog@main/app/main.jsx?deps=react@18.3.1";
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e));
      });
    }
  </script>
</body>
</html>
