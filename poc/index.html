<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>esm.sh POC — diagnóstico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #09090b; color: #fafafa; font-family: ui-monospace, "SF Mono", Menlo, monospace;
      padding: 1rem; line-height: 1.5; -webkit-text-size-adjust: 100%; }
    h1 { font-size: 1.1rem; color: #fbbf24; margin-bottom: 0.5rem; }
    .hint { color: #71717a; font-size: 0.8rem; margin-bottom: 1rem; }
    #log { display: flex; flex-direction: column; gap: 0.5rem; }
    .row { padding: 0.75rem 1rem; border-radius: 0.75rem; border: 1px solid #27272a;
      background: #18181b; font-size: 0.85rem; word-break: break-word; }
    .row.ok    { border-color: #16a34a; background: #052e1a; }
    .row.fail  { border-color: #dc2626; background: #2e0505; }
    .label { font-weight: bold; }
    .detail { color: #a1a1aa; font-size: 0.75rem; margin-top: 0.25rem; }
    #render-target { margin-top: 1rem; }
  </style>

  <!-- esm.sh resolves bare "react", "react-dom/client", "react/jsx-runtime"
       to esm.sh CDN URLs at the pinned React version. Compiled .jsx files
       served by esm.sh get their bare React imports rewritten to match. -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime"
    }
  }
  </script>
</head>
<body>
  <h1>POC esm.sh — diagnóstico</h1>
  <div class="hint">
    Cada linha abaixo é um teste sequencial. Se algum falhar, me passa
    a mensagem desta tela (não precisa de DevTools).
  </div>

  <div id="log"></div>
  <div id="render-target"></div>

  <script>
    // Visible logger — surface every result on-screen so we can diagnose from
    // mobile without DevTools.
    window._poc = (function() {
      var logEl = document.getElementById('log');
      function emit(label, kind, detail) {
        var div = document.createElement('div');
        div.className = 'row ' + kind;
        var l = document.createElement('div');
        l.className = 'label';
        l.textContent = (kind === 'ok' ? '✅ ' : '❌ ') + label;
        div.appendChild(l);
        if (detail) {
          var d = document.createElement('div');
          d.className = 'detail';
          d.textContent = detail;
          div.appendChild(d);
        }
        logEl.appendChild(div);
      }
      return {
        ok:   function(label, detail) { emit(label, 'ok', detail); },
        fail: function(label, detail) { emit(label, 'fail', detail); },
      };
    })();

    // Catch any uncaught error so it lands on the screen too.
    window.addEventListener('error', function(e) {
      window._poc.fail('Uncaught error',
        (e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
    });
    window.addEventListener('unhandledrejection', function(e) {
      var msg = e.reason && (e.reason.message || e.reason.toString()) || String(e.reason);
      window._poc.fail('Unhandled promise rejection', msg);
    });

    // T1: importmap support (Chrome 89+, Safari 16.4+, Firefox 108+)
    if (HTMLScriptElement.supports && HTMLScriptElement.supports('importmap')) {
      window._poc.ok('T1 importmap suportado pelo navegador');
    } else {
      window._poc.fail('T1 importmap NÃO suportado',
        'Navegador antigo — esm.sh exige importmap. Atualize Chrome/Safari/Firefox.');
    }
  </script>

  <script type="module">
    const { ok, fail } = window._poc;

    // T2: dynamic import of "react" via importmap.
    let React;
    try {
      React = await import("react");
      ok('T2 import "react" via importmap', 'React v' + (React.version || '?'));
    } catch (e) {
      fail('T2 import "react" falhou', e.message || String(e));
      throw e;
    }

    // T3: "react-dom/client".
    let createRoot;
    try {
      const mod = await import("react-dom/client");
      createRoot = mod.createRoot;
      ok('T3 import "react-dom/client" via importmap');
    } catch (e) {
      fail('T3 import "react-dom/client" falhou', e.message || String(e));
      throw e;
    }

    // T4: raw GitHub fetch — proves the repo is public and the file exists.
    try {
      const r = await fetch("https://raw.githubusercontent.com/lopespt/navlog/main/poc/hello.jsx");
      if (!r.ok) throw new Error("HTTP " + r.status);
      const text = await r.text();
      if (text.indexOf("export function Hello") === -1) {
        throw new Error("hello.jsx baixou mas conteúdo não esperado");
      }
      ok('T4 raw.githubusercontent.com OK (repo público)', text.length + ' bytes');
    } catch (e) {
      fail('T4 raw GitHub fetch falhou',
        (e.message || String(e)) + ' — esm.sh/gh exige repo público.');
      throw e;
    }

    // T5: esm.sh/gh fetch + JSX compile of hello.jsx.
    let HelloModule;
    try {
      HelloModule = await import("https://esm.sh/gh/lopespt/navlog@main/poc/hello.jsx?deps=react@18.3.1");
      if (typeof HelloModule.Hello !== "function") {
        throw new Error("Hello export não é function — got " + typeof HelloModule.Hello);
      }
      ok('T5 esm.sh/gh compilou hello.jsx');
    } catch (e) {
      fail('T5 esm.sh/gh falhou', e.message || String(e));
      throw e;
    }

    // T6: actually render the component.
    try {
      const target = document.getElementById('render-target');
      createRoot(target).render(React.createElement(HelloModule.Hello, { name: "POC" }));
      ok('T6 componente Hello renderizado abaixo ↓',
        'Se o card âmbar aparece com o contador funcionando, padrão OK.');
    } catch (e) {
      fail('T6 render falhou', e.message || String(e));
      throw e;
    }
  </script>

  <noscript>
    <div style="padding: 1rem; color: #ef4444;">JavaScript desativado.</div>
  </noscript>
</body>
</html>
